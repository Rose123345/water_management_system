<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Water System{% endblock %}</title>
</head>
<body style="font-family: Arial, sans-serif; margin:0; background:#F8FAFC; color:#1E293B;">
  <div style="background:#0B5ED7; color:white; padding:12px 20px;">
    <strong>Water Manufacturing System</strong>
  </div>
  <div style="padding:20px;">
    {% if messages %}
      {% for message in messages %}
        <div style="padding:10px; margin-bottom:10px; background:#E0F2FE; border-left:4px solid #0B5ED7;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
