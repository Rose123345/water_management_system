{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_heading %}Products{% endblock %}
{% block content %}
<header class="page-heading"><div><span class="page-kicker">Product catalogue</span><h1>{{ title }}</h1><p>Set product details, pricing, and reorder thresholds.</p></div></header>
<div class="form-shell entry-form">
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions"><button type="submit">Save product</button><a href="{% url 'products:list' %}">Cancel</a></div>
</form>
</div>
{% endblock %}
