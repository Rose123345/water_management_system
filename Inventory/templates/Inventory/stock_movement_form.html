{% extends 'base.html' %}
{% block title %}Record Stock Movement{% endblock %}
{% block content %}
<h1>Record Stock Movement</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <a href="{% url 'inventory:list' %}">Cancel</a>
</form>
{% endblock %}
